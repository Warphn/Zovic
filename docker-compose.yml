# Ambiente do Zovic. Guia de uso: docs/docker.md
#
#   docker compose up                            → banco + migrations
#   docker compose --profile frontend up --build → + API (para quem trabalha no frontend)
#   docker compose --profile full up --build     → + frontend (sistema inteiro)

services:
  db:
    image: postgres:16.15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  flyway:
    image: flyway/flyway:13.9.0
    command: -connectRetries=10 migrate
    volumes: [./db/migrations:/flyway/sql]
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db: { condition: service_healthy }

  api:
    profiles: [frontend, full]
    build: ./api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 3333
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports: ["3333:3333"]
    depends_on:
      db: { condition: service_healthy }
      flyway: { condition: service_completed_successfully }

  web:
    profiles: [full]
    build: ./frontend
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
