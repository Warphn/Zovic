# Ambiente do Zovic. Guia de uso: docs/docker.md
#
#   docker compose up                            → banco + migrations
#   docker compose --profile frontend up --build → + API (para quem trabalha no frontend)
#   docker compose --profile full up --build     → + frontend (sistema inteiro)
#   docker compose --profile prod up -d --build  → servidor: API, frontend e túnel da Cloudflare

services:
  db:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["127.0.0.1:5432:5432"]
    # na rede do túnel para a equipe chegar ao banco de produção, atrás do Cloudflare Access
    networks: [default, tunnel]
    volumes: [pgdata:/var/lib/postgresql/data]
    # teto do container: sem ele, um pico disputa CPU e memória com o resto da máquina
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g, pids: 512 }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  flyway:
    image: flyway/flyway:13.9.0
    # validateMigrationNaming: um arquivo fora do padrão de nome falha em vez de ser ignorado
    command: -connectRetries=10 -validateMigrationNaming=true migrate
    volumes: [./db/migrations:/flyway/sql]
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db: { condition: service_healthy }

  api:
    profiles: [frontend, full, prod]
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 3333
      CORS_ORIGIN: ${CORS_ORIGIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3333}
      # cookie de sessão sem Secure em http local (padrão do compose); veja .env.example
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # vazio desliga; no servidor, 1 (o cloudflared é o proxy à frente da API)
      TRUST_PROXY: ${TRUST_PROXY:-}
    # só esta máquina alcança a porta; de fora, a API chega pelo túnel
    ports: ["127.0.0.1:3333:3333"]
    networks: [default, tunnel]
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g, pids: 256 }
    healthcheck:
      # a imagem oven/bun não garante ter curl
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3333/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 10
    depends_on:
      db: { condition: service_healthy }
      flyway: { condition: service_completed_successfully }

  web:
    profiles: [full, prod]
    build:
      context: ./frontend
      # o Next embute o endereço da API no build: trocar o valor exige refazer a imagem (--build)
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    # o navegador é quem chama a API: o web só precisa ser alcançado pelo túnel, sem ver a api nem o banco
    networks: [site]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m, pids: 128 }
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 10
    depends_on: [api]

  cloudflared:
    profiles: [prod]
    image: cloudflare/cloudflared:2026.10.4
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # token do túnel: só no .env do servidor, nunca versionado
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    # alcança a api, o banco (rede tunnel) e o web (rede site); cada rota pública é cadastrada na Cloudflare
    networks: [tunnel, site]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m, pids: 128 }
    depends_on:
      api: { condition: service_healthy }

networks:
  tunnel:
  site:

volumes:
  pgdata:
